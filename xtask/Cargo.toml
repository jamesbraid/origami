[package]
name = "xtask"
version = "0.0.0"
publish = false
edition = "2021"
rust-version = "1.95"
license = "BSD-3-Clause"

[dependencies]
flate2 = "1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
tar = "0.4"
toml = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
