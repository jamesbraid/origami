[package]
name = "origami"
version = "0.0.0"
publish = false
edition = "2021"
rust-version = "1.95"
license = "BSD-3-Clause"

# A stand-in for QEMU and Instigator that the tests run the product against.
# Cargo builds it for the tests; the release archive is made from
# `--bin origami` and never carries it.
[[bin]]
name = "origami-fake"
path = "tests/bin/fake.rs"
test = false
doctest = false

[workspace]
members = ["crates/disk/rofs", "crates/origami-ffi", "crates/origami-engine", "crates/origami-display", "crates/origami-display-producer", "crates/display-conformance", "crates/origami-core", "crates/origami-machine", "crates/origami-qemu", "crates/origami-nfs", "crates/origami-net", "crates/origami-protocol", "crates/origami-host", "crates/origami-render", "crates/origami-gui", "crates/origami-iris", "crates/origami-gtk", "crates/origami-terminal", "crates/ghostty-vt-sys", "crates/origami-credits", "xtask"]
# origami-gui pulls in Slint and wgpu, which the command-line tool's cargo
# commands and checks should not build. `-p origami-gui` selects it.
default-members = ["crates/disk/rofs", ".", "crates/origami-engine", "crates/origami-display", "crates/origami-display-producer", "crates/display-conformance", "crates/origami-core", "crates/origami-machine", "crates/origami-qemu", "crates/origami-nfs", "crates/origami-net", "crates/origami-protocol", "crates/origami-host", "xtask"]

[features]
# Hosts iris machines in this executable's runner process. Off by default:
# iris adds a long build, and QEMU machines do not need it.
iris = ["origami-iris/runner"]

[dependencies]
origami-iris = { path = "crates/origami-iris" }
origami-engine = { path = "crates/origami-engine" }
origami-core = { path = "crates/origami-core" }
origami-host = { path = "crates/origami-host" }
origami-machine = { path = "crates/origami-machine" }
origami-qemu = { path = "crates/origami-qemu" }
origami-net = { path = "crates/origami-net" }
origami-nfs = { path = "crates/origami-nfs" }
clap = { version = "4.5", features = ["derive"] }
serde_json = "1"
tempfile = "3"
toml = "1"
dunce = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
origami-display = { path = "crates/origami-display" }
origami-engine = { path = "crates/origami-engine", features = ["fake"] }
origami-machine = { path = "crates/origami-machine" }
origami-protocol = { path = "crates/origami-protocol" }
origami-qemu = { path = "crates/origami-qemu" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
qapi = { version = "0.15", features = ["qmp"] }
sha2 = "0.11"
getrandom = "0.4"
ureq = { version = "3", default-features = false, features = ["rustls"] }
url = "2"
# The integration and acceptance tests drive a guest's serial console and clean
# up their network lab on SIGINT and SIGTERM.
libtest-mimic = "0.8"
regex = "1"

[target.'cfg(unix)'.dev-dependencies]
signal-hook = "0.3"

[[test]]
name = "iris"
path = "tests/iris/main.rs"
required-features = ["iris"]

[[test]]
name = "functional"
path = "tests/functional/main.rs"
harness = false

[build-dependencies]
vergen-gitcl = "10"

[patch.crates-io]
# 0.15.0 panics when the stream ends before the QMP greeting, as it does
# when QEMU fails to start. This fork adds the fix from qapi-rs PR 29.
qapi = { git = "https://github.com/jamesbraid/qapi-rs", rev = "3c80a7769b39bba4e25f07460b134dc6efb31996" }

# iris's own [patch.crates-io] entries, repeated because Cargo ignores a
# dependency's patches. Both are directories of the iris repository, found by
# package name in the git source at the same commit.
winit = { git = "https://github.com/jamesbraid/iris", rev = "f9d70ad8cdd15b519da4e8678eb753963e4dd4d6" }
block = { git = "https://github.com/jamesbraid/iris", rev = "f9d70ad8cdd15b519da4e8678eb753963e4dd4d6" }
