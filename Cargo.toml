[package]
name = "origami"
version = "0.0.0"
publish = false
edition = "2021"
rust-version = "1.95"
license = "BSD-3-Clause"

# A stand-in for QEMU and Instigator that the tests run the product against.
# Cargo builds it for the tests; the release archive is made from
# `--bin origami` and never carries it.
[[bin]]
name = "origami-fake"
path = "tests/bin/fake.rs"
test = false
doctest = false

[workspace]
members = ["crates/origami-nfs", "crates/origami-net"]

[dependencies]
origami-net = { path = "crates/origami-net" }
origami-nfs = { path = "crates/origami-nfs" }
clap = { version = "4.5", features = ["derive"] }
dirs = "7"
getrandom = "0.4"
qapi = { version = "0.15", features = ["qmp"] }
serde = { version = "1", features = ["derive"] }
serde-saphyr = "2"
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
toml = "1"
ureq = { version = "3", default-features = false, features = ["rustls"] }
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation"] }

[dev-dependencies]
# The integration and acceptance tests drive a guest's serial console and clean
# up their network lab on SIGINT and SIGTERM.
libtest-mimic = "0.8"
regex = "1"

[target.'cfg(unix)'.dev-dependencies]
signal-hook = "0.3"

[[test]]
name = "functional"
path = "tests/functional/main.rs"
harness = false

[build-dependencies]
vergen-gitcl = "10"

[patch.crates-io]
# 0.15.0 panics when the stream ends before the QMP greeting, as it does
# when QEMU fails to start. This fork adds the fix from qapi-rs PR 29.
qapi = { git = "https://github.com/jamesbraid/qapi-rs", rev = "3c80a7769b39bba4e25f07460b134dc6efb31996" }
