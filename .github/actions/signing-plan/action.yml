name: Signing plan
description: >
  Decide whether this job signs. It does when every secret and variable for the platform
  is set. A tag build with none set skips with a notice on windows and fails on macos;
  with only some set it fails on both.
inputs:
  platform:
    description: Name for messages, macos or windows
    required: true
  required:
    description: Newline-separated NAME=true|false lines, from `secrets.NAME != ''` or `vars.NAME != ''`
    required: true
outputs:
  sign:
    description: 'true when the job should sign'
    value: ${{ steps.plan.outputs.sign }}
runs:
  using: composite
  steps:
    - id: plan
      shell: bash
      env:
        PLATFORM: ${{ inputs.platform }}
        REQUIRED: ${{ inputs.required }}
      run: |
        set -eu
        set=0 missing=""
        while IFS= read -r line; do
          [ -n "$line" ] || continue
          if [ "${line#*=}" = true ]; then set=$((set + 1)); else missing="$missing ${line%%=*}"; fi
        done <<< "$REQUIRED"
        tag=false
        case $GITHUB_REF in refs/tags/v*) tag=true ;; esac
        sign=false
        if [ "$tag" != true ]; then
          echo "::notice title=$PLATFORM signing skipped::Not a v* tag build, so it is unsigned."
        elif [ -z "$missing" ]; then
          sign=true
        elif [ "$set" -eq 0 ] && [ "$PLATFORM" = windows ]; then
          echo "::notice title=$PLATFORM signing skipped::$PLATFORM signing is not configured, so this build is unsigned."
        elif [ "$set" -eq 0 ]; then
          echo "::error title=$PLATFORM signing is not configured::A v* tag must not publish unsigned archives. Missing:$missing"
          exit 1
        else
          echo "::error title=$PLATFORM signing is half configured::Missing:$missing"
          exit 1
        fi
        echo "sign=$sign" >> "$GITHUB_OUTPUT"
