name: Windows app self-test (QEMU engine)
description: Build the app from the downloaded natives, start it on a real machine, capture the window and stop what is left. Leaves apps/windows/selftest-out.
inputs:
  runtime-dir:
    description: The QEMU runtime's libexec/origami folder, relative to the checkout
    required: true
  fail-on-selftest:
    description: Fail the step when the self-test reports a failure
    default: 'true'
runs:
  using: composite
  steps:
    - uses: ./.github/actions/windows-dotnet
    - name: Build the app (unpackaged, self-contained)
      shell: bash
      working-directory: apps/windows
      run: |
        export DOTNET_CLI_TELEMETRY_OPTOUT=1
        set -o pipefail
        time dotnet build Origami.App/Origami.App.csproj -c Release -p:Platform=x64 -p:Qemu=true ${ORIGAMI_VERSION:+-p:Version=${ORIGAMI_VERSION%%-*} -p:InformationalVersion=$ORIGAMI_VERSION} 2>&1 | tail -60
    - name: Self-test with a window capture while the picture is up
      shell: powershell
      working-directory: apps/windows
      env:
        ORIGAMI_CAPTURES: "1"
        RUNTIME_DIR: ${{ inputs.runtime-dir }}
        FAIL_ON_SELFTEST: ${{ inputs.fail-on-selftest }}
      run: |
        $out = Join-Path $PWD "selftest-out"
        New-Item -ItemType Directory -Force $out | Out-Null
        $exe = Get-ChildItem -Recurse -Filter Origami.exe Origami.App\bin | Select-Object -First 1
        "exe: $($exe.FullName)"
        $root = (Resolve-Path "$PWD\..\..").Path
        $env:ORIGAMI_RUNTIME_DIR = [IO.Path]::GetFullPath((Join-Path $root $env:RUNTIME_DIR))
        if (-not (Test-Path (Join-Path $env:ORIGAMI_RUNTIME_DIR "qemu-system-mips64.exe"))) { throw "no QEMU in $env:ORIGAMI_RUNTIME_DIR" }
        $env:ORIGAMI_BIN = "$PWD\Origami.App\native-out\origami.exe"
        @(Get-Process qemu-system-mips64,origami -ErrorAction SilentlyContinue | ForEach-Object { $_.Id }) + 0 | Set-Content "$env:RUNNER_TEMP\before.txt"
        $p = Start-Process -FilePath $exe.FullName -ArgumentList "--selftest","`"$out\selftest.json`"","--settings","`"$out\settings.json`"","--library","`"$out\library`"","--create-product","octane2","--machine-name","octane2","--stderr","`"$out\app-stderr.log`"" `
             -WorkingDirectory $exe.DirectoryName -PassThru
        $null = $p.Handle
        Add-Type -AssemblyName System.Windows.Forms,System.Drawing
        # PrintWindow with PW_RENDERFULLCONTENT asks the compositor for the window itself; the desktop grab can miss DirectComposition content.
        Add-Type -TypeDefinition 'using System;using System.Runtime.InteropServices;public class PW{[DllImport("user32.dll")]public static extern bool PrintWindow(IntPtr h,IntPtr dc,uint f);[DllImport("user32.dll")]public static extern bool GetWindowRect(IntPtr h,out RECT r);public struct RECT{public int L,T,R,B;}}'
        function Grab($h, $path) {
          $r = New-Object PW+RECT
          [void][PW]::GetWindowRect($h,[ref]$r)
          $wb = New-Object System.Drawing.Bitmap ($r.R-$r.L),($r.B-$r.T)
          $wg = [System.Drawing.Graphics]::FromImage($wb)
          $dc = $wg.GetHdc()
          $ok = [PW]::PrintWindow($h,$dc,2)
          $wg.ReleaseHdc($dc)
          # A failed or all-one-colour PrintWindow falls back to the window's rectangle of the desktop grab.
          $seen = @{}
          foreach ($x in 1..9) { foreach ($y in 1..9) { $seen[$wb.GetPixel([int]($wb.Width*$x/10),[int]($wb.Height*$y/10)).ToArgb()] = 1 } }
          if (-not $ok -or $seen.Count -lt 2) {
            "PrintWindow missed (ok=$ok, $($seen.Count) colours): using the desktop grab"
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width,$b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location,[System.Drawing.Point]::Empty,$b.Size)
            $wb = $bmp.Clone((New-Object System.Drawing.Rectangle $r.L,$r.T,($r.R-$r.L),($r.B-$r.T)), $bmp.PixelFormat)
          }
          $wb.Save($path)
          "captured $path $($wb.Width)x$($wb.Height)"
        }
        $deadline = (Get-Date).AddSeconds(420)
        while (-not (Test-Path "$out\ready.txt") -and -not $p.HasExited -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 200 }
        if (Test-Path "$out\ready.txt") { $p.Refresh(); Grab $p.MainWindowHandle "$out\window.png" } else { "no ready marker" }
        New-Item -ItemType File "$out\done.txt" -Force | Out-Null
        # The app asks for more captures with want-NAME.txt holding a window handle, and waits for got-NAME.txt.
        $end = (Get-Date).AddSeconds(180)
        while (-not $p.HasExited -and (Get-Date) -lt $end) {
          foreach ($f in Get-ChildItem $out -Filter "want-*.txt") {
            $name = $f.BaseName.Substring(5)
            $h = [IntPtr][long](Get-Content $f.FullName)
            Remove-Item $f.FullName
            Grab $h "$out\$name.png"
            New-Item -ItemType File "$out\got-$name.txt" -Force | Out-Null
          }
          Start-Sleep -Milliseconds 200
        }
        if (Test-Path "$out\app.log") { "--- app.log"; Get-Content "$out\app.log" -Tail 40 }
        if (-not $p.HasExited) { "self-test did not exit"; $p.Kill(); $code = 99 } else { $code = $p.ExitCode }
        if (Test-Path "$out\selftest.json") { Get-Content "$out\selftest.json" } else { "no selftest.json written"; if (Test-Path "$out\selftest.json.partial") { Get-Content "$out\selftest.json.partial" } }
        "exit code: $code"
        if ($env:FAIL_ON_SELFTEST -eq 'true') {
          if ($code -eq 99) { exit 99 }
          & "$root\apps\windows\ci\selftest-verdict.ps1" -Out $out -ExitCode $code
          exit $LASTEXITCODE
        }
    - name: Machine logs, then stop what is still running (machines outlive the app, and a running one locks its files)
      if: always()
      shell: powershell
      working-directory: apps/windows
      run: |
        Get-ChildItem selftest-out\library -Recurse -Filter *.log -ErrorAction SilentlyContinue | ForEach-Object {
          "=== $($_.FullName)"; Get-Content $_.FullName -Tail 60 -ErrorAction SilentlyContinue }
        if (Test-Path selftest-out\app-stderr.log) { "=== app stderr"; Get-Content selftest-out\app-stderr.log -Tail 80 }
        Get-Process qemu-system-mips64,origami -ErrorAction SilentlyContinue | Where-Object { $_.Id -notin (Get-Content "$env:RUNNER_TEMP\before.txt") } | Stop-Process -Force
        Start-Sleep 2
