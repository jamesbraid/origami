name: Check out pinned dependencies
description: Initialize the QEMU and Instigator Git submodules
inputs:
  qemu-read-key:
    description: Optional read-only SSH key for the QEMU repository
    required: false
    default: ''
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        QEMU_READ_KEY: ${{ inputs.qemu-read-key }}
      run: |
        set -euo pipefail
        if [ -n "$QEMU_READ_KEY" ]; then
          key_dir=$(mktemp -d)
          trap 'rm -rf "$key_dir"' EXIT
          if [ "$RUNNER_OS" = Windows ]; then key_dir=$(cygpath -m "$key_dir"); fi
          umask 077
          printf '%s\n' "$QEMU_READ_KEY" > "$key_dir/key"
          unset QEMU_READ_KEY
          gh api meta --jq '.ssh_keys[] | "github.com " + .' > "$key_dir/known_hosts"
          git config submodule.qemu.url git@github.com:jamesbraid/qemu.git
          GIT_SSH_COMMAND="ssh -i '$key_dir/key' -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile='$key_dir/known_hosts'" \
            git submodule update --init -- qemu
        else
          git submodule update --init -- qemu
        fi
        git submodule update --init -- instigator
