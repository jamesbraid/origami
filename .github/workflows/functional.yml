name: Functional tests (IRIX boots)

# Nightly, when main has moved since the last passing run: build the product
# archive on each OS, then boot a published IRIX 6.5.30 Origin 200 disk with it
# and check login, uname, hinv, a network address, a ping, NFS reads and writes, a
# CD-ROM read and a clean halt. The systems and their expected answers are the
# rows of tests/data/systems.toml; the trials are tests/functional. A failure
# fails the run, and the README badge follows the run.
on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: functional
  cancel-in-progress: false

jobs:
  # A scheduled run does nothing when the last passing run was of this commit.
  plan:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.moved.outputs.run }}
    steps:
      - id: moved
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_EVENT_NAME" != schedule ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          last=$(gh run list -R "$GITHUB_REPOSITORY" --workflow functional.yml --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
          if [ "$last" = "$GITHUB_SHA" ]; then
            echo "main has not moved since the last passing run ($last)" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  # Until the Cargo build replaces CMake, the archives are built here as the
  # other workflows build them.
  archive:
    needs: plan
    if: needs.plan.outputs.run == 'true' && github.server_url == 'https://github.com'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, runner: ubuntu-24.04, platform: linux-x86_64, preset: linux, kind: container }
          # Cross-built here, booted on windows-latest by the functional job.
          - { os: windows, runner: ubuntu-24.04, platform: windows-x86_64, preset: windows-cross, kind: container }
          - { os: macos, runner: macos-15, platform: macos-arm64, preset: macos, kind: native }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: true
          token: ${{ secrets.DEPENDENCY_READ_TOKEN || github.token }}
      - id: vcpkg
        run: |
          mkdir -p "$RUNNER_TEMP/build-vcpkg-cache"
          echo "commit=$(git -C vcpkg rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/build-vcpkg-cache
          key: vcpkg-${{ matrix.platform }}-${{ steps.vcpkg.outputs.commit }}-${{ hashFiles('vcpkg.json', 'cmake/vcpkg/**') }}
          restore-keys: vcpkg-${{ matrix.platform }}-
      - if: matrix.kind == 'container'
        timeout-minutes: 50
        uses: ./.github/actions/build-archive
        with:
          preset: ${{ matrix.preset }}
          build-dir: ${{ runner.temp }}/build
      - if: matrix.kind == 'native'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: matrix.kind == 'native'
        run: brew install cmake ninja pkg-config meson rust autoconf automake libtool
      - if: matrix.kind == 'native'
        uses: actions/setup-go@v5
        with:
          go-version-file: instigator/go.mod
      - if: matrix.kind == 'native'
        timeout-minutes: 50
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.temp }}/build-vcpkg-cache
        run: |
          cmake --preset macos -B "$RUNNER_TEMP/build"
          cmake --build "$RUNNER_TEMP/build" --target binaries --parallel 4
          ctest --test-dir "$RUNNER_TEMP/build" --output-on-failure
          cpack --config "$RUNNER_TEMP/build/CPackConfig.cmake" -B "$RUNNER_TEMP/build/artifacts"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: origami-${{ matrix.os }}
          path: ${{ runner.temp }}/build/artifacts/origami-*-${{ matrix.platform }}.*
          if-no-files-found: ignore
          retention-days: 3

  boot:
    name: boot on ${{ matrix.os }}
    needs: [plan, archive]
    # Not skipped by another OS's failed archive; a missing artifact fails here.
    if: ${{ !cancelled() && needs.plan.outputs.run == 'true' && github.server_url == 'https://github.com' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, runner: ubuntu-24.04 }
          - { os: macos, runner: macos-15 }
          - { os: windows, runner: windows-latest }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: false
          token: ${{ secrets.DEPENDENCY_READ_TOKEN || github.token }}
      - uses: ./.github/actions/functional-setup
        with:
          os: ${{ matrix.os }}
          token: ${{ secrets.DEPENDENCY_READ_TOKEN || github.token }}
      - name: Boot and check
        timeout-minutes: 65
        run: cargo test --test functional -- 'qemu::'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: functional-${{ matrix.os }}
          path: ${{ runner.temp }}/functional-out
          if-no-files-found: ignore
          retention-days: 14
