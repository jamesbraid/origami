name: Release

# A v* tag builds the CLI and app packages and publishes them with SHA256SUMS
# and the CHANGELOG.md section. The tag is made on the canonical repository.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    if: github.server_url == 'https://github.com'
    uses: ./.github/workflows/build.yml

  publish:
    needs: build
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: origami-*
          path: assets
          merge-multiple: true
      - name: Checksums and release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          version=${TAG#v}
          # The thin macOS packages feed the universal ones; they are not releases.
          rm -f assets/*-macos-arm64.* assets/*-macos-x86_64.*
          ls assets
          test "$(ls assets/origami-cli-*.tar.gz assets/origami-cli-*.zip | wc -l)" = 5
          test "$(ls assets/origami-*.tar.gz assets/origami-*.zip | grep -vc '/origami-cli-')" = 5
          # A dirty or untagged build would be named for the commit instead.
          for f in assets/origami-*; do
            case $f in
              assets/origami-cli-"$version"-* | assets/origami-"$version"-*) ;;
              *) echo "$f is not named for $version" >&2; exit 1 ;;
            esac
          done
          (cd assets && sha256sum -- *.tar.gz *.zip > SHA256SUMS && sha256sum --check SHA256SUMS)
          # The section under "## <version> - <date>" (or a bare "## <version>"
          # for releases before dated headings), up to the next "## ".
          awk -v v="$version" '$0 == "## " v || index($0, "## " v " - ") == 1 {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no ## $version section" >&2
            exit 1
          fi
          # GPL: the corresponding source of the bundled QEMU, next to the binaries.
          qemu=$(sed -n 's/^tag = "\(sgi-origami-[^"]*\)"/\1/p' runtime.lock)
          printf '\nQEMU source: https://github.com/jamesbraid/qemu-sgi-origami/tree/%s\n' "$qemu" >> notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" assets/* --verify-tag --title "$TAG" --notes-file notes.md

  # The tap's cask and formula follow the release just published. Only v*
  # tags reach the release environment, which holds the tap token. A tag with
  # a suffix (v0.7.0-rc1) is a prerelease and leaves the tap alone.
  tap:
    needs: publish
    if: github.server_url == 'https://github.com' && !contains(github.ref_name, '-')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
    steps:
      - name: The tap token is set
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          test -n "$TOKEN" || { echo "HOMEBREW_TAP_TOKEN is not set in the release environment" >&2; exit 1; }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: jamesbraid/homebrew-origami
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Update the cask and formula
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir .
          .github/scripts/update-tap.sh "$TAG" SHA256SUMS tap
          cd tap
          git add Casks/origami.rb Formula/origami-cli.rb
          if git diff --cached --quiet; then
            echo "tap already at $TAG"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "origami: update to ${TAG#v}" -m "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          git push origin HEAD:main
