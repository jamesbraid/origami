name: Release

# A v* tag builds the CLI and app packages and publishes them with SHA256SUMS
# and the CHANGELOG.md section. The tag is made on the canonical repository.
# A manual run builds every package unsigned and checks the archives as a
# release would, then stops: nothing is uploaded, signed or notarized.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.server_url == 'https://github.com'
    uses: ./.github/workflows/build.yml
    # The signing jobs read the release environment's secrets, which a called workflow only sees when inherited.
    secrets: inherit

  # Signs the four Windows zips after the build, so id-token: write is granted to this job alone.
  sign-windows:
    needs: build
    if: github.server_url == 'https://github.com' && github.event_name == 'push'
    name: sign ${{ matrix.artifact }}
    runs-on: windows-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        artifact: [origami-windows-x86_64, origami-windows-arm64, origami-app-windows-x86_64, origami-app-windows-arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist
      - name: Signing plan
        id: sign-win
        uses: ./.github/actions/signing-plan
        with:
          platform: windows
          required: |
            AZURE_TENANT_ID=${{ vars.AZURE_TENANT_ID != '' }}
            AZURE_CLIENT_ID=${{ vars.AZURE_CLIENT_ID != '' }}
            AZURE_SUBSCRIPTION_ID=${{ vars.AZURE_SUBSCRIPTION_ID != '' }}
            AZURE_SIGNING_ENDPOINT=${{ vars.AZURE_SIGNING_ENDPOINT != '' }}
            AZURE_SIGNING_ACCOUNT=${{ vars.AZURE_SIGNING_ACCOUNT != '' }}
            AZURE_SIGNING_PROFILE=${{ vars.AZURE_SIGNING_PROFILE != '' }}
      - name: Unpack the archive for signing
        id: files
        if: steps.sign-win.outputs.sign == 'true'
        shell: pwsh
        run: build/sign/windows-list.ps1 -Archive (Get-Item dist/origami-*.zip).FullName -Work "$env:RUNNER_TEMP\sign"
      - name: Azure login
        if: steps.sign-win.outputs.sign == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Sign with Artifact Signing
        if: steps.sign-win.outputs.sign == 'true'
        uses: Azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files: ${{ steps.files.outputs.files }}
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true
      - name: Check the signatures and re-pack the archive
        if: steps.sign-win.outputs.sign == 'true'
        shell: pwsh
        env:
          SIGNED_FILES: ${{ steps.files.outputs.files }}
        run: build/sign/windows-pack.ps1 -Archive (Get-Item dist/origami-*.zip).FullName -Work "${{ steps.files.outputs.root }}" -Files $env:SIGNED_FILES
      - uses: actions/upload-artifact@v4
        if: steps.sign-win.outputs.sign == 'true'
        with:
          name: ${{ matrix.artifact }}
          path: dist/origami-*
          overwrite: true
          if-no-files-found: error
          retention-days: 3

  dry-run:
    needs: build
    if: github.server_url == 'https://github.com' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: origami-*
          path: assets
          merge-multiple: true
      - name: The archives are the release's, named for this checkout
        run: |
          v=$(git describe --tags --match 'v[0-9]*' --always)
          .github/scripts/release-assets.sh "${v#v}" assets

  publish:
    needs: [build, sign-windows]
    if: github.server_url == 'https://github.com' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: origami-*
          path: assets
          merge-multiple: true
      - name: Checksums and release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          version=${TAG#v}
          .github/scripts/release-assets.sh "$version" assets
          # The section under "## <version> - <date>" (or a bare "## <version>"
          # for releases before dated headings), up to the next "## ".
          awk -v v="$version" '$0 == "## " v || index($0, "## " v " - ") == 1 {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no ## $version section" >&2
            exit 1
          fi
          # GPL: the corresponding source of the bundled QEMU, next to the binaries.
          qemu=$(sed -n 's/^tag = "\(sgi-origami-[^"]*\)"/\1/p' runtime.lock)
          printf '\nQEMU source: https://github.com/jamesbraid/qemu-sgi-origami/tree/%s\n' "$qemu" >> notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" assets/* --verify-tag --title "Origami $TAG" --notes-file notes.md

  # The tap's cask and formula follow the release just published. Only v*
  # tags reach the release environment, which holds the tap token. A tag with
  # a suffix (v0.7.0-rc1) is a prerelease and leaves the tap alone.
  tap:
    needs: publish
    if: github.server_url == 'https://github.com' && github.event_name == 'push' && !contains(github.ref_name, '-')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
    steps:
      - name: The tap token is set
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          test -n "$TOKEN" || { echo "HOMEBREW_TAP_TOKEN is not set in the release environment" >&2; exit 1; }
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: jamesbraid/homebrew-origami
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Update the cask and formula
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern SHA256SUMS --dir .
          .github/scripts/update-tap.sh "$TAG" SHA256SUMS tap
          cd tap
          git add Casks/origami.rb Formula/origami-cli.rb
          if git diff --cached --quiet; then
            echo "tap already at $TAG"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -m "origami: update to ${TAG#v}" -m "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG"
          git push origin HEAD:main
