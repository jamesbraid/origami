name: Build

# Builds the product natively on each OS against the QEMU and Instigator
# releases in runtime.lock: tests, release archive, and a check that the
# extracted archive starts. Nothing here compiles QEMU or Instigator.
#
# Reusable: release.yml calls it for tags. It uploads one artifact per
# platform, origami-<platform>, holding the archive and its .sha256.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.server_url == 'https://github.com'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, platform: linux-x86_64 }
          - { runner: macos-15, platform: macos-arm64 }
          - { runner: windows-latest, platform: windows-x86_64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      # Full history so the version can describe the nearest v* tag.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          rustc -Vv
      - uses: ./.github/actions/qapi-schema-copies
        if: matrix.platform == 'windows-x86_64'
      - name: QEMU links the host's audio clients
        if: matrix.platform == 'linux-x86_64'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpulse0 libasound2t64
      - name: Test
        run: cargo xtask test
      - name: Package
        run: cargo xtask dist --out dist
      - name: Start the extracted archive
        # Run from a path with spaces, as a user's home may be.
        run: |
          python - <<'PY'
          import glob, os, shutil, subprocess, sys, tempfile
          archive = glob.glob("dist/origami-*-${{ matrix.platform }}.*")
          archive = [a for a in archive if not a.endswith(".sha256")]
          assert len(archive) == 1, archive
          root = tempfile.mkdtemp(prefix="origami extract ")
          shutil.unpack_archive(archive[0], root)
          (top,) = os.listdir(root)
          exe = os.path.join(root, top, "bin", "origami" + (".exe" if os.name == "nt" else ""))
          out = subprocess.run([exe, "version"], capture_output=True, text=True, check=True).stdout
          print(out)
          # `origami version` prints "unavailable" for a program that does not run.
          assert "unavailable" not in out, out
          assert "qemu " in out and "instigator " in out, out
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: origami-${{ matrix.platform }}
          path: dist/origami-*
          if-no-files-found: error
          retention-days: 3
