name: Build

# Builds the product natively on each OS against the QEMU and Instigator releases in runtime.lock.
# Reusable: release.yml calls it; it uploads origami-<platform> and origami-app-<platform> artifacts.
# A v* tag run signs in the `release` environment (build/sign/); every other run stays out and is unsigned.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.server_url == 'https://github.com'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, platform: linux-x86_64 }
          - { runner: ubuntu-24.04-arm, platform: linux-arm64 }
          - { runner: macos-15, platform: macos-arm64 }
          - { runner: macos-15-intel, platform: macos-x86_64 }
          - { runner: windows-latest, platform: windows-x86_64 }
          - { runner: windows-11-arm, platform: windows-arm64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      # Full history so the version can describe the nearest v* tag.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy,rustfmt
          rustup default stable
          rustc -Vv
      - uses: ./.github/actions/qapi-schema-copies
        if: startsWith(matrix.platform, 'windows')
      # No Instigator release has a Windows arm64 archive, so xtask builds the pinned source
      # (Go is the version in its go.mod).
      - uses: actions/setup-go@v5
        if: matrix.platform == 'windows-arm64'
        with:
          go-version: '1.27.1'
          cache: false
      - name: QEMU links the host's audio clients
        if: startsWith(matrix.platform, 'linux')
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpulse0 libasound2t64
      - name: Test
        run: cargo xtask test
      - name: Package
        run: cargo xtask dist --out dist
      - name: Start the extracted archive
        # Run from a path with spaces, as a user's home may be.
        run: |
          python - <<'PY'
          import glob, os, shutil, subprocess, sys, tempfile
          archive = glob.glob("dist/origami-cli-*-${{ matrix.platform }}.*")
          assert len(archive) == 1, archive
          root = tempfile.mkdtemp(prefix="origami extract ")
          shutil.unpack_archive(archive[0], root)
          (top,) = os.listdir(root)
          exe = os.path.join(root, top, "bin", "origami" + (".exe" if os.name == "nt" else ""))
          out = subprocess.run([exe, "version"], capture_output=True, text=True, check=True).stdout
          print(out)
          # `origami version` prints "unavailable" for a program that does not run.
          assert "unavailable" not in out, out
          assert "qemu " in out and "instigator " in out, out
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: origami-${{ matrix.platform }}
          path: dist/origami-*
          if-no-files-found: error
          retention-days: 3

  app-linux:
    if: github.server_url == 'https://github.com'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, platform: linux-x86_64 }
          - { runner: ubuntu-24.04-arm, platform: linux-arm64 }
    runs-on: ${{ matrix.runner }}
    # The GTK app needs GTK 4.14 or newer and its Forgejo job builds in this image.
    container:
      image: docker.io/library/node:22-trixie
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Packages and Rust
        run: |
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git xz-utils build-essential pkg-config clang cmake \
            libgtk-4-dev libadwaita-1-dev libvulkan-dev libdrm-dev libgbm-dev libegl-dev libgles-dev glslc spirv-tools \
            libxkbcommon-dev libssl-dev libpulse0 libasound2t64
          curl --fail --show-error --silent --proto '=https' --tlsv1.2 \
            https://sh.rustup.rs -o "$RUNNER_TEMP/rustup-init.sh"
          sh "$RUNNER_TEMP/rustup-init.sh" -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: The checkout has a version
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          v=$(git describe --tags --match 'v[0-9]*' --always)
          echo "$v"
          test -n "$v" && test "$v" != unknown
      - name: Package
        run: cargo xtask dist --app --out dist
      - name: Start the extracted package
        run: |
          set -eu
          root="$RUNNER_TEMP/origami extract"
          mkdir -p "$root"
          tar -xzf dist/origami-*-${{ matrix.platform }}.tar.gz -C "$root"
          for top in "$root"/*/; do
            out=$("${top}bin/origami" version)
            echo "$out"
            case $out in *unavailable*) exit 1 ;; esac
            test -x "${top}bin/origami-gtk"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: origami-app-${{ matrix.platform }}
          path: dist/origami-*
          if-no-files-found: error
          retention-days: 3

  app-macos:
    if: github.server_url == 'https://github.com'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-26, platform: macos-arm64 }
          - { runner: macos-26-intel, platform: macos-x86_64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc -Vv
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # xtask runs apps/macos/build.sh with the iris engine, then ad hoc signs the bundle.
      - name: Package
        run: cargo xtask dist --app --out dist
      - name: Start the extracted package and check its signature
        run: |
          set -eu
          root="$RUNNER_TEMP/origami extract"
          mkdir -p "$root"
          ditto -x -k dist/origami-*-${{ matrix.platform }}.zip "$root"
          app="$root/Origami.app"
          codesign --verify --deep --strict "$app"
          out=$("$app/Contents/MacOS/origami" version)
          echo "$out"
          case $out in *unavailable*) exit 1 ;; esac
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: origami-app-${{ matrix.platform }}
          path: dist/origami-*
          if-no-files-found: error
          retention-days: 3

  # The Windows app's Rust parts are cross-built with MinGW on Linux, as
  # package-windows.yml does, and the C# app and the zip are made on Windows.
  app-windows-native:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Cross compiler and Rust
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64
          rustup toolchain install stable --profile minimal --target x86_64-pc-windows-gnu
          rustup default stable
          rustc -Vv
      - uses: ./.github/actions/cargo-cache
        with:
          name: package-windows
      - name: Install the C# generator (the pin crates/origami-ffi/bindings/csharp/gen.sh names)
        uses: ./.github/actions/cargo-bin
        with:
          bin: uniffi-bindgen-cs
          key: uniffi-bindgen-cs-v0.12.0+v0.32.0
          install: cargo install uniffi-bindgen-cs --locked --git https://github.com/NordSecurity/uniffi-bindgen-cs --tag v0.12.0+v0.32.0
      # The runner must not import libstdc++-6.dll, which a user's machine lacks: put only the
      # static archives where the linker looks first, so -lstdc++ and -lwinpthread resolve to them.
      - name: Static MinGW runtime
        run: |
          mkdir -p "$RUNNER_TEMP/static"
          for l in stdc++ winpthread; do
            ln -sf "$(x86_64-w64-mingw32-g++-posix -print-file-name=lib$l.a)" "$RUNNER_TEMP/static/lib$l.a"
          done
          echo "CARGO_TARGET_X86_64_PC_WINDOWS_GNU_RUSTFLAGS=-L native=$RUNNER_TEMP/static -C link-arg=-static-libgcc" >> "$GITHUB_ENV"
      # libchdman-rs has no prebuilt for MinGW, so it builds from source. Its FLAC needs HAVE_FSEEKO and a 64-bit
      # off_t to match MinGW's fseeko64, and the posix thread model for libgcc to link.
      - name: Build the Rust parts
        env:
          LIBCHDMAN_FORCE_SOURCE: '1'
          CFLAGS_x86_64_pc_windows_gnu: -D_FILE_OFFSET_BITS=64 -DHAVE_FSEEKO=1
          CXXFLAGS_x86_64_pc_windows_gnu: -D_FILE_OFFSET_BITS=64 -DHAVE_FSEEKO=1
          CC_x86_64_pc_windows_gnu: x86_64-w64-mingw32-gcc-posix
          CXX_x86_64_pc_windows_gnu: x86_64-w64-mingw32-g++-posix
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-g++-posix
        run: cargo xtask dist --app --platform windows-x86_64 --target x86_64-pc-windows-gnu --prebuild "$PWD/prebuilt"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-prebuilt
          path: prebuilt
          if-no-files-found: error
          retention-days: 3

  app-windows:
    if: github.server_url == 'https://github.com'
    needs: app-windows-native
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: windows-prebuilt
          path: prebuilt
      - uses: ./.github/actions/windows-dotnet
      - name: Package
        run: |
          export DOTNET_CLI_TELEMETRY_OPTOUT=1
          prebuilt/xtask.exe dist --app --platform windows-x86_64 --prebuilt prebuilt --out dist
          ls -la dist
      - name: The packaged runner has iris linked
        run: |
          mkdir check && /c/Windows/System32/tar.exe -xf dist/origami-*-windows-x86_64.zip -C check
          grep -c "iris runner panicked" check/*/bin/origami.exe
      - name: Start the extracted package
        # From a path with spaces, as a user's home may be.
        shell: powershell
        run: |
          $zip = (Get-ChildItem dist\origami-*-windows-x86_64.zip).FullName
          $root = Join-Path $env:RUNNER_TEMP "origami extract"
          New-Item -ItemType Directory -Force $root | Out-Null
          tar -xf $zip -C $root
          $top = (Get-ChildItem $root).FullName
          & "$top\bin\origami.exe" version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $out = Join-Path $env:RUNNER_TEMP "selftest-out"
          New-Item -ItemType Directory -Force $out | Out-Null
          $p = Start-Process -FilePath "$top\app\Origami.exe" -ArgumentList "--selftest","`"$out\selftest.json`"","--settings","`"$out\settings.json`"","--stderr","`"$out\stderr.log`"","--library","`"$out\library`"","--create-product","octane2" -WorkingDirectory "$top\app" -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(240000)) { $p.Kill(); "self-test did not exit"; exit 99 }
          if (Test-Path "$out\selftest.json") { Get-Content "$out\selftest.json" } elseif (Test-Path "$out\selftest.json.partial") { Get-Content "$out\selftest.json.partial" }
          foreach ($f in "app.log","stderr.log") { if (Test-Path "$out\$f") { "--- $f"; Get-Content "$out\$f" -Tail 60 } }
          "exit code: $($p.ExitCode)"
          exit $p.ExitCode
      - uses: actions/upload-artifact@v4
        with:
          name: origami-app-windows-x86_64
          path: dist/origami-*
          if-no-files-found: error
          retention-days: 3

  # No cross toolchain targets Windows arm64 from Linux with MSVC's ABI, so one
  # native job builds the Rust parts, the C# bindings, the app and the zip.
  app-windows-arm64:
    if: github.server_url == 'https://github.com'
    runs-on: windows-11-arm
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc -Vv
      - uses: ./.github/actions/qapi-schema-copies
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - uses: ./.github/actions/cargo-cache
        with:
          name: app-windows-arm64
      - name: Install the C# generator (the pin crates/origami-ffi/bindings/csharp/gen.sh names)
        uses: ./.github/actions/cargo-bin
        with:
          bin: uniffi-bindgen-cs
          key: uniffi-bindgen-cs-v0.12.0+v0.32.0
          install: cargo install uniffi-bindgen-cs --locked --git https://github.com/NordSecurity/uniffi-bindgen-cs --tag v0.12.0+v0.32.0
      - uses: ./.github/actions/windows-dotnet
      - name: Package
        run: |
          export DOTNET_CLI_TELEMETRY_OPTOUT=1
          cargo xtask dist --app --out dist
          ls -la dist
      - name: Start the extracted package
        # From a path with spaces, as a user's home may be.
        shell: powershell
        run: |
          $zip = (Get-ChildItem dist\origami-*-windows-arm64.zip).FullName
          $root = Join-Path $env:RUNNER_TEMP "origami extract"
          New-Item -ItemType Directory -Force $root | Out-Null
          tar -xf $zip -C $root
          $top = (Get-ChildItem $root).FullName
          & "$top\bin\origami.exe" version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $out = Join-Path $env:RUNNER_TEMP "selftest-out"
          New-Item -ItemType Directory -Force $out | Out-Null
          $p = Start-Process -FilePath "$top\app\Origami.exe" -ArgumentList "--selftest","`"$out\selftest.json`"","--settings","`"$out\settings.json`"","--stderr","`"$out\stderr.log`"","--library","`"$out\library`"","--create-product","octane2" -WorkingDirectory "$top\app" -PassThru
          $null = $p.Handle
          if (-not $p.WaitForExit(240000)) { $p.Kill(); "self-test did not exit"; exit 99 }
          if (Test-Path "$out\selftest.json") { Get-Content "$out\selftest.json" } elseif (Test-Path "$out\selftest.json.partial") { Get-Content "$out\selftest.json.partial" }
          foreach ($f in "app.log","stderr.log") { if (Test-Path "$out\$f") { "--- $f"; Get-Content "$out\$f" -Tail 60 } }
          "exit code: $($p.ExitCode)"
          # This runner's desktop session never gives the app the foreground or keyboard focus,
          # which the x64 runner does, so the checks that need them are not held against it.
          $json = if (Test-Path "$out\selftest.json") { "$out\selftest.json" } else { "$out\selftest.json.partial" }
          $steps = (Get-Content -Raw $json | ConvertFrom-Json).steps
          $needsFocus = '^(window is the foreground window|about: (the right arrow|typing))'
          $failed = @($steps | Where-Object { -not $_.Ok -and $_.Name -notmatch $needsFocus })
          if ($failed.Count -gt 0) { "failed: $($failed.Name -join ', ')"; exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: origami-app-windows-arm64
          path: dist/origami-*
          if-no-files-found: error
          retention-days: 3

  # One macOS download: each Mach-O in the arm64 and x86_64 packages joined with lipo,
  # then signed and notarized once (tag builds). The thin packages stay artifacts for other workflows.
  macos-universal:
    if: github.server_url == 'https://github.com'
    needs: [build, app-macos]
    runs-on: macos-26
    # A tag build notarizes twice, each given up to 150 minutes, after the join.
    timeout-minutes: ${{ startsWith(github.ref, 'refs/tags/v') && 330 || 30 }}
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: origami-*macos-*
          path: thin
      - name: Join the packages
        run: |
          set -eu
          rustup toolchain install stable --profile minimal
          rustup default stable
          mkdir dist
          for kind in macos app-macos; do
            case $kind in
              macos) a=thin/origami-macos-arm64/origami-cli-*-macos-arm64.tar.gz; b=thin/origami-macos-x86_64/origami-cli-*-macos-x86_64.tar.gz ;;
              app-macos) a=thin/origami-app-macos-arm64/origami-*-macos-arm64.zip; b=thin/origami-app-macos-x86_64/origami-*-macos-x86_64.zip ;;
            esac
            cargo xtask universal --arm64 $a --x86_64 $b --out dist
          done
          ls -l dist
      - name: Every Mach-O holds both architectures
        run: |
          set -eu
          mkdir check
          tar -xzf dist/origami-cli-*-macos-universal.tar.gz -C check
          ditto -x -k dist/origami-*-macos-universal.zip check
          count=0
          while IFS= read -r f; do
            if file "$f" | grep -q 'Mach-O'; then
              info=$(lipo -info "$f")
              echo "$info"
              case $info in *x86_64*arm64*|*arm64*x86_64*) count=$((count + 1)) ;; *) echo "not universal: $f" >&2; exit 1 ;; esac
            fi
          done < <(find check -type f)
          test "$count" -ge 10
      - name: Signing plan
        id: sign-mac
        uses: ./.github/actions/signing-plan
        with:
          platform: macos
          required: |
            MACOS_CERT_P12_BASE64=${{ secrets.MACOS_CERT_P12_BASE64 != '' }}
            MACOS_CERT_PASSWORD=${{ secrets.MACOS_CERT_PASSWORD != '' }}
            APPLE_TEAM_ID=${{ secrets.APPLE_TEAM_ID != '' }}
            ASC_KEY_ID=${{ secrets.ASC_KEY_ID != '' }}
            ASC_ISSUER_ID=${{ secrets.ASC_ISSUER_ID != '' }}
            ASC_KEY_P8_BASE64=${{ secrets.ASC_KEY_P8_BASE64 != '' }}
      - name: Import the signing certificate
        if: steps.sign-mac.outputs.sign == 'true'
        env:
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: build/sign/macos-keychain.sh
      - name: Sign and notarize
        if: steps.sign-mac.outputs.sign == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: build/sign/macos-sign.sh dist/origami-cli-*-macos-universal.tar.gz dist/origami-*-macos-universal.zip
      - name: The signed QEMU starts under the hardened runtime
        if: steps.sign-mac.outputs.sign == 'true'
        run: build/sign/macos-smoke.sh dist/origami-*-macos-universal.zip
      - name: Remove the signing keychain
        if: always() && steps.sign-mac.outputs.sign == 'true'
        run: build/sign/macos-cleanup.sh
      - uses: actions/upload-artifact@v4
        with:
          name: origami-macos-universal
          path: dist/origami-*
          if-no-files-found: error
          retention-days: 3

  # The universal packages start on both kinds of Mac, as the thin ones start on theirs.
  macos-universal-start:
    if: github.server_url == 'https://github.com'
    needs: macos-universal
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-26, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: origami-macos-universal
          path: dist
      - name: Start the extracted packages and check the signature
        run: |
          set -eu
          uname -m
          root="$RUNNER_TEMP/origami extract"
          mkdir -p "$root"
          ditto -x -k dist/origami-*-macos-universal.zip "$root"
          app="$root/Origami.app"
          codesign --verify --deep --strict "$app"
          out=$("$app/Contents/MacOS/origami" version)
          echo "$out"
          case $out in *unavailable*) exit 1 ;; esac
          tar -xzf dist/origami-cli-*-macos-universal.tar.gz -C "$root"
          out=$("$root"/origami-cli-*/bin/origami version)
          echo "$out"
          case $out in *unavailable*) exit 1 ;; esac
