name: Build release archives

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platform:
        description: Archive to build
        required: true
        type: choice
        options:
          - linux-x86_64
          - macos-arm64
          - windows-x86_64

permissions:
  contents: read

jobs:
  linux:
    concurrency:
      group: native-preview-${{ github.workflow }}-${{ github.ref }}-linux-x86_64
      cancel-in-progress: false
    if: github.server_url != 'https://github.com' && github.event_name == 'workflow_dispatch' && inputs.platform == 'linux-x86_64' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    container:
      image: ${{ vars.CI_JOB_IMAGE }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: true
          token: ${{ secrets.DEPENDENCY_READ_TOKEN }}
      - name: Prepare Docker CLI
        run: |
          apt-get update
          apt-get install -y --no-install-recommends docker.io python3
      - name: Test Docker path translation
        run: python3 -m unittest build.tests.test_ci_docker -v
      - name: Check Docker daemon
        run: docker info --format '{{.ServerVersion}}'
      - uses: ./.github/actions/build-archive
        with:
          preset: linux
          build-dir: ${{ github.workspace }}/.ci-build
          engine: ${{ github.workspace }}/build/ci-docker.py
      - uses: actions/upload-artifact@v3
        with:
          name: origami-linux-x86_64-preview
          path: |
            ${{ github.workspace }}/.ci-build/artifacts/origami-linux-x86_64-preview.tar.gz
            ${{ github.workspace }}/.ci-build/artifacts/origami-linux-x86_64-preview.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  macos:
    concurrency:
      group: native-preview-${{ github.workflow }}-${{ github.ref }}-macos-arm64
      cancel-in-progress: false
    if: github.server_url == 'https://github.com' && !github.event.repository.private && (github.event_name != 'workflow_dispatch' || (inputs.platform == 'macos-arm64' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))))
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          brew install cmake dylibbundler glib pixman sdl2 ninja pkg-config meson rust
          test "$(brew list --versions dylibbundler)" = "dylibbundler 1.0.5"
      - uses: actions/setup-go@v5
        with:
          go-version-file: instigator/go.mod
      - name: Build archive
        run: |
          cmake --preset macos -B "$RUNNER_TEMP/build"
          time cmake --build "$RUNNER_TEMP/build" --target binaries --parallel 4
          ctest --test-dir "$RUNNER_TEMP/build" --output-on-failure
          cpack --config "$RUNNER_TEMP/build/CPackConfig.cmake" -B "$RUNNER_TEMP/build/artifacts"
      - name: Smoke test extracted archive
        run: |
          mkdir -p "$RUNNER_TEMP/smoke/package with spaces"
          tar -xzf "$RUNNER_TEMP/build/artifacts/origami-macos-arm64-preview.tar.gz" -C "$RUNNER_TEMP/smoke/package with spaces"
          python3 build/smoke-test.py "$RUNNER_TEMP/smoke/package with spaces/macos-arm64-dev" --scratch "$RUNNER_TEMP/smoke"
      - uses: actions/upload-artifact@v4
        with:
          name: origami-macos-arm64-preview
          path: |
            ${{ runner.temp }}/build/artifacts/origami-macos-arm64-preview.tar.gz
            ${{ runner.temp }}/build/artifacts/origami-macos-arm64-preview.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  windows:
    concurrency:
      group: native-preview-${{ github.workflow }}-${{ github.ref }}-windows-x86_64
      cancel-in-progress: false
    if: github.server_url != 'https://github.com' && github.event_name == 'workflow_dispatch' && inputs.platform == 'windows-x86_64' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    container:
      image: ${{ vars.CI_JOB_IMAGE }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: true
          token: ${{ secrets.DEPENDENCY_READ_TOKEN }}
      - name: Prepare Docker CLI
        run: |
          apt-get update
          apt-get install -y --no-install-recommends docker.io python3
      - name: Test Docker path translation
        run: python3 -m unittest build.tests.test_ci_docker -v
      - name: Check Docker daemon
        run: docker info --format '{{.ServerVersion}}'
      - uses: ./.github/actions/build-archive
        with:
          preset: windows-cross
          build-dir: ${{ github.workspace }}/.ci-build
          engine: ${{ github.workspace }}/build/ci-docker.py
      - uses: actions/upload-artifact@v3
        with:
          name: origami-windows-x86_64-preview
          path: |
            ${{ github.workspace }}/.ci-build/artifacts/origami-windows-x86_64-preview.zip
            ${{ github.workspace }}/.ci-build/artifacts/origami-windows-x86_64-preview.zip.sha256
          if-no-files-found: error
          retention-days: 14

  github-containers:
    if: github.server_url == 'https://github.com' && !github.event.repository.private && (github.event_name != 'workflow_dispatch' || inputs.platform != 'macos-arm64')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.platform) || '["linux-x86_64", "windows-x86_64"]') }}
    concurrency:
      group: release-${{ github.ref }}-${{ matrix.platform }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: true
      - uses: ./.github/actions/build-archive
        if: github.event_name != 'workflow_dispatch' || inputs.platform == matrix.platform
        with:
          preset: ${{ matrix.platform == 'linux-x86_64' && 'linux' || 'windows-cross' }}
          build-dir: ${{ runner.temp }}/build
      - name: Smoke test Linux archive
        if: matrix.platform == 'linux-x86_64' && (github.event_name != 'workflow_dispatch' || inputs.platform == matrix.platform)
        run: |
          mkdir -p "$RUNNER_TEMP/smoke/package with spaces"
          tar -xzf "$RUNNER_TEMP/build/artifacts/origami-linux-x86_64-preview.tar.gz" -C "$RUNNER_TEMP/smoke/package with spaces"
          python3 build/smoke-test.py "$RUNNER_TEMP/smoke/package with spaces/linux-dev" --scratch "$RUNNER_TEMP/smoke"
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'workflow_dispatch' || inputs.platform == matrix.platform
        with:
          name: origami-${{ matrix.platform }}-preview
          path: ${{ runner.temp }}/build/artifacts/origami-${{ matrix.platform }}-preview.*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [github-containers, macos]
    if: github.server_url == 'https://github.com' && !github.event.repository.private && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: origami-*-preview
          path: release-assets
          merge-multiple: true
      - name: Verify and publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: release-assets
        run: |
          cat ./*.sha256 > SHA256SUMS
          test "$(wc -l < SHA256SUMS)" -eq 3
          sha256sum -c SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
            --title "Origami $GITHUB_REF_NAME" --notes-file ../docs/release-notes.md \
            ./origami-*-preview.* ./SHA256SUMS
