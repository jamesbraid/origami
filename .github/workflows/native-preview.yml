name: Preview archives

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      platform:
        description: Archive to build
        required: true
        type: choice
        options:
          - linux-x86_64
          - macos-arm64
          - windows-x86_64

permissions:
  contents: read

jobs:
  linux:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'linux-x86_64'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: ./.github/actions/checkout-submodules
        with:
          qemu-read-key: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && secrets.QEMU_READ_KEY || '' }}
      - name: Build archive
        env:
          SGI_CONTAINER_ENGINE: docker
        run: |
          mkdir -p "$RUNNER_TEMP/build"
          sh build/linux-dev.sh "$PWD/qemu" "$PWD/instigator" "$RUNNER_TEMP/build"
      - uses: actions/upload-artifact@v4
        with:
          name: origami-linux-x86_64-preview
          path: |
            ${{ runner.temp }}/build/origami-linux-x86_64-preview.tar.gz
            ${{ runner.temp }}/build/origami-linux-x86_64-preview.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  macos:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'macos-arm64'
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: ./.github/actions/checkout-submodules
        with:
          qemu-read-key: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && secrets.QEMU_READ_KEY || '' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          brew install glib pixman sdl2 libslirp ninja pkg-config meson rust
      - uses: actions/setup-go@v5
        with:
          go-version-file: instigator/go.mod
      - name: Build archive
        run: |
          mkdir -p "$RUNNER_TEMP/build"
          sh build/macos-dev.sh "$PWD/qemu" "$PWD/instigator" "$RUNNER_TEMP/build"
      - uses: actions/upload-artifact@v4
        with:
          name: origami-macos-arm64-preview
          path: |
            ${{ runner.temp }}/build/origami-macos-arm64-preview.tar.gz
            ${{ runner.temp }}/build/origami-macos-arm64-preview.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  windows:
    if: github.event_name != 'workflow_dispatch' || inputs.platform == 'windows-x86_64'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: ./.github/actions/checkout-submodules
        with:
          qemu-read-key: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && secrets.QEMU_READ_KEY || '' }}
      - name: Build archive
        env:
          SGI_CONTAINER_ENGINE: docker
        run: |
          mkdir -p "$RUNNER_TEMP/build"
          sh build/windows-dev.sh "$PWD/qemu" "$PWD/instigator" "$RUNNER_TEMP/build"
      - uses: actions/upload-artifact@v4
        with:
          name: origami-windows-x86_64-preview
          path: |
            ${{ runner.temp }}/build/origami-windows-x86_64-preview.zip
            ${{ runner.temp }}/build/origami-windows-x86_64-preview.zip.sha256
          if-no-files-found: error
          retention-days: 14
