name: Preview archives

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platform:
        description: Archive to build
        required: true
        type: choice
        options:
          - linux-x86_64
          - macos-arm64
          - windows-x86_64

permissions:
  contents: read

jobs:
  linux:
    concurrency:
      group: native-preview-${{ github.workflow }}-${{ github.ref }}-linux-x86_64
      cancel-in-progress: false
    if: github.server_url != 'https://github.com' && (github.event_name != 'workflow_dispatch' || (inputs.platform == 'linux-x86_64' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))))
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    container:
      image: ${{ vars.CI_JOB_IMAGE }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: true
          token: ${{ secrets.DEPENDENCY_READ_TOKEN }}
      - name: Prepare Docker CLI
        run: |
          apt-get update
          apt-get install -y --no-install-recommends docker.io python3
      - name: Test Docker path translation
        run: python3 -m unittest build.tests.test_ci_docker -v
      - name: Check Docker daemon
        run: docker info --format '{{.ServerVersion}}'
      - name: Build archive
        run: |
          mkdir -p "$PWD/.ci-build"
          export SGI_CONTAINER_ENGINE="$PWD/build/ci-docker.py"
          sh build/linux-dev.sh "$PWD/qemu" "$PWD/instigator" "$PWD/.ci-build"
      - uses: actions/upload-artifact@v3
        with:
          name: origami-linux-x86_64-preview
          path: |
            ${{ github.workspace }}/.ci-build/origami-linux-x86_64-preview.tar.gz
            ${{ github.workspace }}/.ci-build/origami-linux-x86_64-preview.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  macos:
    concurrency:
      group: native-preview-${{ github.workflow }}-${{ github.ref }}-macos-arm64
      cancel-in-progress: false
    if: github.server_url == 'https://github.com' && (github.event_name != 'workflow_dispatch' || (inputs.platform == 'macos-arm64' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))))
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: ./.github/actions/checkout-submodules
        with:
          qemu-read-key: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && secrets.QEMU_READ_KEY || '' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          brew install dylibbundler glib pixman sdl2 libslirp ninja pkg-config meson rust
          test "$(brew list --versions dylibbundler)" = "dylibbundler 1.0.5"
      - name: Test macOS bundle
        run: python3 -m unittest build.tests.test_macos_homebrew_notices -v
      - uses: actions/setup-go@v5
        with:
          go-version-file: instigator/go.mod
      - name: Build archive
        run: |
          mkdir -p "$RUNNER_TEMP/build"
          sh build/macos-dev.sh "$PWD/qemu" "$PWD/instigator" "$RUNNER_TEMP/build"
      - uses: actions/upload-artifact@v4
        with:
          name: origami-macos-arm64-preview
          path: |
            ${{ runner.temp }}/build/origami-macos-arm64-preview.tar.gz
            ${{ runner.temp }}/build/origami-macos-arm64-preview.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  windows:
    concurrency:
      group: native-preview-${{ github.workflow }}-${{ github.ref }}-windows-x86_64
      cancel-in-progress: false
    if: github.server_url != 'https://github.com' && (github.event_name != 'workflow_dispatch' || (inputs.platform == 'windows-x86_64' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))))
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    container:
      image: ${{ vars.CI_JOB_IMAGE }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: true
          token: ${{ secrets.DEPENDENCY_READ_TOKEN }}
      - name: Prepare Docker CLI
        run: |
          apt-get update
          apt-get install -y --no-install-recommends docker.io python3
      - name: Test Docker path translation
        run: python3 -m unittest build.tests.test_ci_docker -v
      - name: Check Docker daemon
        run: docker info --format '{{.ServerVersion}}'
      - name: Build archive
        run: |
          mkdir -p "$PWD/.ci-build"
          export SGI_CONTAINER_ENGINE="$PWD/build/ci-docker.py"
          sh build/windows-dev.sh "$PWD/qemu" "$PWD/instigator" "$PWD/.ci-build"
      - uses: actions/upload-artifact@v3
        with:
          name: origami-windows-x86_64-preview
          path: |
            ${{ github.workspace }}/.ci-build/origami-windows-x86_64-preview.zip
            ${{ github.workspace }}/.ci-build/origami-windows-x86_64-preview.zip.sha256
          if-no-files-found: error
          retention-days: 14
