name: app-windows-qemu
# The Windows app against the core's real QEMU engine (manual; the tag needs a Windows archive with the
# shared-memory display). The archive's SHA-256 is pinned below from the release's SHA256SUMS.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: QEMU release tag
        default: sgi-origami-11.1.90-2

jobs:
  native:
    if: github.server_url != 'https://github.com'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/windows-qemu-native
        with:
          cache-name: app-windows-qemu
      - uses: actions/upload-artifact@v3
        with:
          name: windows-native-qemu
          path: out
          if-no-files-found: error
          retention-days: 3

  windows:
    if: github.server_url != 'https://github.com'
    needs: native
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ github.event.inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v3
        with:
          name: windows-native-qemu
          path: apps/windows/Origami.App
      - uses: actions/cache@v4
        with:
          path: qemu.zip
          key: qemu-windows-zip-${{ inputs.tag }}
      - name: Fetch the QEMU archive and lay out the runtime
        shell: powershell
        run: |
          if ($env:TAG -notmatch '^sgi-origami-[0-9.]+-[0-9]+$') { throw "bad tag" }
          $url = "https://github.com/jamesbraid/qemu-sgi-origami/releases/download/$env:TAG/$env:TAG-windows-x86_64.zip"
          if (-not (Test-Path qemu.zip)) { Invoke-WebRequest $url -OutFile qemu.zip -UseBasicParsing }
          $sha = [BitConverter]::ToString([Security.Cryptography.SHA256]::Create().ComputeHash([IO.File]::ReadAllBytes("$PWD\qemu.zip"))).Replace("-","").ToLower()
          # From the release's SHA256SUMS; a new tag adds its line here.
          $pinned = @{ "sgi-origami-11.1.90-2" = "42e82fb531ac960c60603fbee69f76c1bd810fc57928221393f9af33659c59f9" }
          if ($pinned[$env:TAG] -ne $sha) { throw "QEMU archive $env:TAG has sha256 $sha, not the pinned one" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::ExtractToDirectory("$PWD\qemu.zip", "$PWD\qemu")
          # The core looks for QEMU in libexec/origami and its data in share/origami/qemu.
          New-Item -ItemType Directory -Force "$PWD\runtime\libexec\origami", "$PWD\runtime\share\origami\qemu" | Out-Null
          Copy-Item "$PWD\qemu\bin\*" "$PWD\runtime\libexec\origami" -Recurse
          Copy-Item "$PWD\qemu\share\qemu\*" "$PWD\runtime\share\origami\qemu" -Recurse
          Get-ChildItem "$PWD\qemu" -Recurse -Depth 2 | Select-Object -First 40 -ExpandProperty FullName
          Get-ChildItem "$PWD\runtime\share\origami\qemu" | Select-Object -First 10 -ExpandProperty FullName
          & "$PWD\runtime\libexec\origami\qemu-system-mips64.exe" --version
      - uses: ./.github/actions/windows-qemu-selftest
        with:
          runtime-dir: runtime/libexec/origami
      - uses: actions/upload-artifact@v3
        if: always()
        with:
          name: windows-qemu-selftest
          path: apps/windows/selftest-out
          if-no-files-found: warn
