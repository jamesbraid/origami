name: vmnet network check

# Boots an Octane2 PROM on `origami network-set --mode vmnet` against a real
# socket_vmnet on a macOS runner and checks its BOOTP and TFTP netboot reaches a
# dnsmasq on the vmnet bridge. It builds its own archive so it never slows a
# release; a manual run can borrow a native-preview run's archive instead.

on:
  schedule:
    - cron: '41 3 * * *'
  workflow_dispatch:
    inputs:
      archive-run:
        description: native-preview run ID whose macOS archive to test instead of building one
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: vmnet-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vmnet:
    if: github.server_url == 'https://github.com' && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/test/') || startsWith(github.ref, 'refs/tags/v'))
    runs-on: macos-15
    timeout-minutes: 120
    env:
      ARCHIVE_RUN: ${{ inputs.archive-run }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: ${{ inputs.archive-run == '' }}
          token: ${{ secrets.DEPENDENCY_READ_TOKEN || github.token }}
      - name: Fetch the macOS archive
        if: inputs.archive-run != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$ARCHIVE_RUN" --repo "$GITHUB_REPOSITORY" \
            --name origami-macos-arm64 --dir "$RUNNER_TEMP/build/artifacts"
      - id: vcpkg
        if: inputs.archive-run == ''
        run: |
          mkdir -p "$RUNNER_TEMP/vcpkg-cache"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$RUNNER_TEMP/vcpkg-cache" >> "$GITHUB_ENV"
          echo "commit=$(git -C vcpkg rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        if: inputs.archive-run == ''
        with:
          path: ${{ runner.temp }}/vcpkg-cache
          key: vcpkg-macos-arm64-${{ steps.vcpkg.outputs.commit }}-${{ hashFiles('vcpkg.json', 'cmake/vcpkg/**') }}
          restore-keys: vcpkg-macos-arm64-
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        if: inputs.archive-run == ''
        run: |
          brew install cmake ninja pkg-config meson rust autoconf automake libtool
      - uses: actions/setup-go@v5
        if: inputs.archive-run == ''
        with:
          go-version-file: instigator/go.mod
      - name: Build archive
        if: inputs.archive-run == ''
        run: |
          cmake --preset macos -B "$RUNNER_TEMP/build"
          cmake --build "$RUNNER_TEMP/build" --target binaries --parallel 4
          cpack --config "$RUNNER_TEMP/build/CPackConfig.cmake" -B "$RUNNER_TEMP/build/artifacts"
      - name: Extract the archive
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          tar -xzf "$RUNNER_TEMP"/build/artifacts/origami-*-macos-arm64.tar.gz -C "$RUNNER_TEMP/package"
      - name: Start socket_vmnet
        run: |
          brew install socket_vmnet dnsmasq
          mkdir -p "$(brew --prefix)/var/run"
          sudo nohup "$(brew --prefix)/opt/socket_vmnet/bin/socket_vmnet" \
            --vmnet-gateway=192.168.105.1 "$(brew --prefix)/var/run/socket_vmnet" \
            > "$RUNNER_TEMP/socket_vmnet.log" 2>&1 &
          for _ in $(seq 30); do
            test -S "$(brew --prefix)/var/run/socket_vmnet" && break
            sleep 1
          done
          cat "$RUNNER_TEMP/socket_vmnet.log"
          test -S "$(brew --prefix)/var/run/socket_vmnet"
      - name: Check a guest over vmnet
        run: |
          mkdir -p "$RUNNER_TEMP/scratch"
          python3 build/vmnet-check.py "$RUNNER_TEMP"/package/origami-* \
            --socket "$(brew --prefix)/var/run/socket_vmnet" \
            --dnsmasq "$(brew --prefix dnsmasq)/sbin/dnsmasq" \
            --scratch "$RUNNER_TEMP/scratch" --out "$RUNNER_TEMP/vmnet-logs"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vmnet-logs
          path: |
            ${{ runner.temp }}/vmnet-logs
            ${{ runner.temp }}/socket_vmnet.log
          if-no-files-found: ignore
          retention-days: 14
