name: CLI tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.server_url != 'https://github.com'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Rust
        run: |
          curl --fail --show-error --silent --proto '=https' --tlsv1.2 \
            https://sh.rustup.rs -o "$RUNNER_TEMP/rustup-init.sh"
          sh "$RUNNER_TEMP/rustup-init.sh" -y --profile minimal --component clippy,rustfmt --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Record toolchain
        run: rustc -Vv
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint the CLI crates
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Lint the iris engine, with and without iris linked
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libclang-dev
          cargo clippy --locked -p origami-iris --all-targets -- -D warnings
          cargo clippy --locked -p origami-iris --features runner --all-targets -- -D warnings
      - name: Test the CLI crates (replays the Instigator transcripts)
        run: cargo test --locked
      - name: Test build helpers
        run: python3 -m unittest discover -s build/tests -p 'test_*.py' -v
