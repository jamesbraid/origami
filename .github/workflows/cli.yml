name: CLI tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.server_url != 'https://github.com'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.DEPENDENCY_READ_TOKEN || github.token }}
          persist-credentials: false
          fetch-depth: 0
          submodules: true
      - name: Install Rust
        run: |
          curl --fail --show-error --silent --proto '=https' --tlsv1.2 \
            https://sh.rustup.rs -o "$RUNNER_TEMP/rustup-init.sh"
          sh "$RUNNER_TEMP/rustup-init.sh" -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Record toolchain
        run: rustc -Vv
      - name: Install test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config libglib2.0-dev \
            zlib1g-dev python3 python3-venv
      - name: Build the firmware library
        run: |
          mkdir -p "$RUNNER_TEMP/qemu-build"
          cd "$RUNNER_TEMP/qemu-build"
          "$GITHUB_WORKSPACE/qemu/configure" --disable-system --disable-user \
            --enable-tools --disable-docs --without-default-features
          make -j2 libsgi-firmware-core.a
      - name: Test CLI
        run: |
          SGI_FIRMWARE_ARCHIVE="$RUNNER_TEMP/qemu-build/libsgi-firmware-core.a" \
          SGI_FIRMWARE_SOURCE_DIR="$GITHUB_WORKSPACE/qemu" cargo test --locked
      - name: Test build and packaging helpers
        run: |
          SGI_FIRMWARE_ARCHIVE="$RUNNER_TEMP/qemu-build/libsgi-firmware-core.a" \
          SGI_FIRMWARE_SOURCE_DIR="$GITHUB_WORKSPACE/qemu" \
            python3 -m unittest discover -s build/tests -p 'test_*.py' -v
