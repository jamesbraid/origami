name: CLI tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.server_url != 'https://github.com'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - name: Use canonical QEMU repository
        run: |
          git config --global \
            "url.${{ github.server_url }}/jamesb/qemu.git.insteadOf" \
            "https://github.com/jamesbraid/qemu-sgi-origami.git"
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.DEPENDENCY_READ_TOKEN || github.token }}
          persist-credentials: false
          fetch-depth: 0
          submodules: true
      - name: Install Rust
        run: |
          curl --fail --show-error --silent --proto '=https' --tlsv1.2 \
            https://sh.rustup.rs -o "$RUNNER_TEMP/rustup-init.sh"
          sh "$RUNNER_TEMP/rustup-init.sh" -y --profile minimal --component clippy,rustfmt --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Record toolchain
        run: rustc -Vv
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint CLI and NFS crate
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test CLI and NFS crate (replays the Instigator RPC transcripts)
        run: cargo test --locked --workspace
      - name: Test build helpers
        run: python3 -m unittest discover -s build/tests -p 'test_*.py' -v
