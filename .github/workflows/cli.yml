name: CLI tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          submodules: false
      - uses: ./.github/actions/checkout-submodules
        with:
          qemu-read-key: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && secrets.QEMU_READ_KEY || '' }}
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal
      - name: Record toolchain
        run: rustc +stable -Vv
      - name: Test CLI
        run: cargo +stable test --locked
