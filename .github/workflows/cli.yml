name: CLI tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.server_url != 'https://github.com'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.DEPENDENCY_READ_TOKEN || github.token }}
          persist-credentials: false
          submodules: true
      - name: Install Rust
        run: |
          curl --fail --show-error --silent --proto '=https' --tlsv1.2 \
            https://sh.rustup.rs -o "$RUNNER_TEMP/rustup-init.sh"
          sh "$RUNNER_TEMP/rustup-init.sh" -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Record toolchain
        run: rustc -Vv
      - name: Test CLI
        run: cargo test --locked
      - name: Install build test tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends cmake ninja-build
      - name: Test build and packaging helpers
        run: python3 -m unittest discover -s build/tests -p 'test_*.py' -v
