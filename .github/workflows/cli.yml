name: CLI tests

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md', 'apps/**']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', '**.md', 'apps/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.server_url != 'https://github.com'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install Rust
        run: |
          curl --fail --show-error --silent --proto '=https' --tlsv1.2 \
            https://sh.rustup.rs -o "$RUNNER_TEMP/rustup-init.sh"
          sh "$RUNNER_TEMP/rustup-init.sh" -y --profile minimal --component clippy,rustfmt --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: ./.github/actions/cargo-cache
        with:
          name: cli-test
      - name: Record toolchain
        run: rustc -Vv
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint the CLI crates
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Lint the iris engine, with and without iris linked
        run: |
          apt-get update
          apt-get install -y --no-install-recommends libclang-dev
          cargo clippy --locked -p origami-iris --all-targets -- -D warnings
          cargo clippy --locked -p origami-iris --features runner --all-targets -- -D warnings
      - name: Test the CLI crates (replays the Instigator transcripts)
        run: cargo test --locked
      - name: Test build helpers
        run: |
          apt-get install -y --no-install-recommends python3-pil
          python3 -m unittest discover -s build/tests -p 'test_*.py' -v

  windows-check:
    if: github.server_url != 'https://github.com'
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-24.04' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install the cross compiler and Rust
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64
          curl --fail --show-error --silent --proto '=https' --tlsv1.2 \
            https://sh.rustup.rs -o "$RUNNER_TEMP/rustup-init.sh"
          sh "$RUNNER_TEMP/rustup-init.sh" -y --profile minimal --default-toolchain stable \
            --target x86_64-pc-windows-gnu
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: ./.github/actions/cargo-cache
        with:
          name: cli-windows
      # The runner feature links iris, whose CHD library has no MinGW build; it
      # needs the MSVC toolchain.
      - name: Check the iris engine and display producer for Windows
        run: cargo check --locked --all-targets --target x86_64-pc-windows-gnu -p origami-iris -p origami-display-producer
