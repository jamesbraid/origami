name: Smoke

# Nightly: build the product on each OS, boot a prepared IRIX 6.5.30 Origin 200
# with it and check login, hinv, ping, NFS, CD-ROM and a clean halt.
#
# A failed build or check fails the run, and the README's built-in workflow
# badge follows the run. Each OS's per-check results go to the run summary;
# results.json and the console logs are kept as the smoke-<os> artifact.
on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke
  cancel-in-progress: false

jobs:
  archive:
    if: github.server_url == 'https://github.com'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, runner: ubuntu-24.04, platform: linux-x86_64, preset: linux, kind: container }
          # Cross-built here, booted on windows-latest by the smoke job.
          - { os: windows, runner: ubuntu-24.04, platform: windows-x86_64, preset: windows-cross, kind: container }
          - { os: macos, runner: macos-15, platform: macos-arm64, preset: macos, kind: native }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
          submodules: true
          token: ${{ secrets.DEPENDENCY_READ_TOKEN || github.token }}
      - id: vcpkg
        run: |
          mkdir -p "$RUNNER_TEMP/build-vcpkg-cache"
          echo "commit=$(git -C vcpkg rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/build-vcpkg-cache
          key: vcpkg-${{ matrix.platform }}-${{ steps.vcpkg.outputs.commit }}-${{ hashFiles('vcpkg.json', 'cmake/vcpkg/**') }}
          restore-keys: vcpkg-${{ matrix.platform }}-
      - if: matrix.kind == 'container'
        timeout-minutes: 50
        uses: ./.github/actions/build-archive
        with:
          preset: ${{ matrix.preset }}
          build-dir: ${{ runner.temp }}/build
      - if: matrix.kind == 'native'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - if: matrix.kind == 'native'
        run: brew install cmake ninja pkg-config meson rust autoconf automake libtool
      - if: matrix.kind == 'native'
        uses: actions/setup-go@v5
        with:
          go-version-file: instigator/go.mod
      - if: matrix.kind == 'native'
        timeout-minutes: 50
        env:
          VCPKG_DEFAULT_BINARY_CACHE: ${{ runner.temp }}/build-vcpkg-cache
        run: |
          cmake --preset macos -B "$RUNNER_TEMP/build"
          cmake --build "$RUNNER_TEMP/build" --target binaries --parallel 4
          ctest --test-dir "$RUNNER_TEMP/build" --output-on-failure
          cpack --config "$RUNNER_TEMP/build/CPackConfig.cmake" -B "$RUNNER_TEMP/build/artifacts"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: origami-${{ matrix.os }}
          path: ${{ runner.temp }}/build/artifacts/origami-*-${{ matrix.platform }}.*
          if-no-files-found: ignore
          retention-days: 3

  smoke:
    needs: archive
    # Runs even when the archive job failed, so the missing archive shows up as a
    # failed boot step and a summary rather than a skipped job.
    if: always() && github.server_url == 'https://github.com'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux, runner: ubuntu-24.04 }
          - { os: macos, runner: macos-15 }
          - { os: windows, runner: windows-latest }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      # Windows pipes default to the ANSI code page; the product's output need not be ASCII.
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout: tests
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: QEMU links the host's audio clients
        if: matrix.os == 'linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpulse0 libasound2t64
      - uses: actions/download-artifact@v4
        with:
          name: origami-${{ matrix.os }}
          path: in/archive
      - name: Boot and check
        timeout-minutes: 22
        run: |
          # Not `ls a b`: it exits 2 when only one of the two patterns matches,
          # which fails the step under bash's -e -o pipefail.
          archive=$(find in/archive -maxdepth 1 \( -name 'origami-*.tar.gz' -o -name 'origami-*.zip' \) | head -n 1)
          test -n "$archive"
          mkdir -p out
          python tests/smoke/boot.py --product "$archive" --work "$RUNNER_TEMP/smoke" --results out/results.json
      - name: Summarize the checks
        if: always()
        env:
          OS: ${{ matrix.os }}
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, os
          try:
              r = json.load(open("out/results.json"))
          except (OSError, ValueError):
              print(f"### {os.environ['OS']}: no results\n\nboot.py wrote no results; the archive or the download failed first.")
          else:
              print(f"### {os.environ['OS']}: {r['status']} in {r.get('duration_s')}s, attempts {r.get('attempts')}\n")
              if r.get("error"):
                  print(f"Error: {r['error']}\n")
              for name, c in r.get("checks", {}).items():
                  print(f"- {'pass' if c['ok'] else 'FAIL'} {name}" + ("" if c["ok"] else f": {c['detail']}"))
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.os }}
          path: |
            out
            ${{ runner.temp }}/smoke/evidence
          if-no-files-found: ignore
          retention-days: 14
