name: screenshots
# App pictures for the docs, one job per platform; `tools/screenshots pull` collects the artifacts.
# Each job also holds the main window with a running machine against tests/screenshots.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to show in About, such as 0.6.2; empty uses git describe'
        required: false

permissions:
  contents: read

jobs:
  linux:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04
    container:
      image: docker.io/library/node:22-trixie
    timeout-minutes: 90
    env:
      XVFB_SCREEN: 1440x960
      SHOTS_ONLY: '1'
      LIBRARY: /home/user/Machines
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Version from the tags, as the release build gets it
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "ORIGAMI_VERSION=${VERSION:-$(git describe --tags --match 'v[0-9]*' --always | sed 's/^v//')}" >> "$GITHUB_ENV"
      - uses: ./.github/actions/cargo-cache
        with:
          name: screenshots-linux
          target: ${{ runner.temp }}/shots/target
          extra: ${{ runner.temp }}/shots/cache
      - name: Build the app and take the app's pictures
        run: sh crates/origami-gtk/ci/native.sh "$RUNNER_TEMP/shots" docs
      - name: Take the command line's pictures
        run: |
          S="$RUNNER_TEMP/shots"
          mkdir -p "$S/work/cli" "$S/out/cli" set
          ORIGAMI_BIN="$S/target/release/origami" WORK="$S/work/cli" ORIGAMI_RUNTIME_DIR="$S/rt/libexec/origami" \
            ORIGAMI_CACHE_DIR="$S/cache" sh tools/screenshots-cli.sh "$S/out/cli"
          cp "$S"/out/docs/linux-*.png "$S"/out/docs/linux-parity.json "$S"/out/cli/cli-*.png set/
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-linux
          path: set
          if-no-files-found: error
          retention-days: 14
      - name: The main window matches its stored picture
        run: |
          apt-get install -y --no-install-recommends python3-pil
          python3 tools/screenshots compare --platform linux --from set
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots-linux-diff
          path: set/*.diff.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: screenshots-linux-logs
          path: ${{ runner.temp }}/shots/out
          retention-days: 3

  windows-native:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/windows-qemu-native
        with:
          cache-name: screenshots-windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows-native-qemu
          path: out
          if-no-files-found: error
          retention-days: 1

  windows:
    if: github.server_url == 'https://github.com'
    needs: windows-native
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Version from the tags, as the release build gets it
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "ORIGAMI_VERSION=${VERSION:-$(git describe --tags --match 'v[0-9]*' --always | sed 's/^v//')}" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: windows-native-qemu
          path: apps/windows/Origami.App
      - run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo xtask runtime --platform windows-x86_64
      - uses: ./.github/actions/windows-qemu-selftest
        with:
          runtime-dir: target/runtime/windows-x86_64/tree/libexec/origami
          fail-on-selftest: 'false'
      - run: |
          mkdir set
          cp apps/windows/selftest-out/window.png set/windows-running.png
          cp apps/windows/selftest-out/windows-cpu-panel.png apps/windows/selftest-out/windows-diagnostics.png set/
          cp apps/windows/selftest-out/windows-acknowledgements.png apps/windows/selftest-out/windows-licences.png set/
          cp apps/windows/selftest-out/windows-install-assistant.png apps/windows/selftest-out/windows-ready-disk.png apps/windows/selftest-out/windows-network.png set/
          cp apps/windows/selftest-out/windows-parity.json set/
          # The cube's own readback, which a window capture of the Direct3D child window may miss.
          cp apps/windows/selftest-out/about-cube.png set/windows-about-cube.png
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-windows
          path: set
          if-no-files-found: error
          retention-days: 14
      - name: The main window matches its stored picture
        run: |
          python -m pip install --quiet pillow
          python tools/screenshots compare --platform windows --from set
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots-windows-diff
          path: set/*.diff.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: screenshots-windows-logs
          path: apps/windows/selftest-out
          retention-days: 3

  macos:
    # macos-26 and Rust 1.97.1 are what app-macos.yml builds this app with.
    if: github.server_url == 'https://github.com'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Version from the tags, as the release build gets it
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          echo "ORIGAMI_VERSION=${VERSION:-$(git describe --tags --match 'v[0-9]*' --always | sed 's/^v//')}" >> "$GITHUB_ENV"
      - name: Install Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
      - name: Build the app on the fake engine and render its pictures
        run: apps/macos/screenshots.sh "$RUNNER_TEMP/macos-shots"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: screenshots-macos
          path: |
            ${{ runner.temp }}/macos-shots/macos-*.png
            ${{ runner.temp }}/macos-shots/macos-parity.json
          if-no-files-found: error
          retention-days: 14
      - name: The main window matches its stored picture
        run: |
          python3 -m venv "$RUNNER_TEMP/pil"
          "$RUNNER_TEMP/pil/bin/pip" install --quiet pillow
          "$RUNNER_TEMP/pil/bin/python" tools/screenshots compare --platform macos --from "$RUNNER_TEMP/macos-shots"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure()
        with:
          name: screenshots-macos-diff
          path: ${{ runner.temp }}/macos-shots/*.diff.png
          if-no-files-found: ignore

  parity:
    # The three apps must name the sidebar, the Settings tabs, the New Machine fields and the install steps alike.
    if: github.server_url == 'https://github.com'
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: screenshots-linux
          path: names/linux
      - uses: actions/download-artifact@v4
        with:
          name: screenshots-windows
          path: names/windows
      - uses: actions/download-artifact@v4
        with:
          name: screenshots-macos
          path: names/macos
      - run: |
          python3 -m venv "$RUNNER_TEMP/pil"
          "$RUNNER_TEMP/pil/bin/pip" install --quiet pillow
          "$RUNNER_TEMP/pil/bin/python" tools/screenshots parity --from names
