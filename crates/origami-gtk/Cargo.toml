[package]
name = "origami-gtk"
version = "0.0.0"
publish = false
edition = "2021"
rust-version = "1.95"
license = "BSD-3-Clause"

# The native Linux app: GTK 4 and libadwaita over the shared core.
[[bin]]
name = "origami-gtk"
path = "src/main.rs"

[dependencies]
origami-core = { path = "../origami-core" }
origami-display = { path = "../origami-display" }
origami-engine = { path = "../origami-engine" }
origami-machine = { path = "../origami-machine" }
origami-qemu = { path = "../origami-qemu" }
origami-terminal = { path = "../origami-terminal" }
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_6"] }
ash = "0.38"
async-channel = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
vt100 = "0.18"
pangocairo = "0.22"
dirs = "7"

[dev-dependencies]
tempfile = "3"
