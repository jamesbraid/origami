[package]
name = "origami-gtk"
version = "0.0.0"
publish = false
edition = "2021"
rust-version = "1.95"
license = "BSD-3-Clause"

# The native Linux app: GTK 4 and libadwaita over the shared core.
[[bin]]
name = "origami-gtk"
path = "src/main.rs"

# A virtual pointer for the Wayland checks, which no compositor in the test
# images offers on its own. Not part of the app.
[[bin]]
name = "vptr"
path = "ci/vptr.rs"
required-features = ["test-tools"]

[features]
test-tools = ["dep:wayland-protocols-wlr"]
# The `behaviour` automation request, for the self-test. Never in a release.
selftest = ["origami-core/selftest"]
# The iris engine beside QEMU. iris itself runs in the `origami` runner, which
# must be built with its own `iris` feature.
iris = ["dep:origami-iris"]

[dependencies]
wayland-protocols-wlr = { version = "0.3", features = ["client"], optional = true }
origami-core = { path = "../origami-core" }
origami-credits = { path = "../origami-credits" }
origami-display = { path = "../origami-display" }
origami-engine = { path = "../origami-engine" }
origami-iris = { path = "../origami-iris", optional = true }
origami-machine = { path = "../origami-machine" }
origami-qemu = { path = "../origami-qemu" }
origami-render = { path = "../origami-render" }
origami-terminal = { path = "../origami-terminal" }
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_6"] }
ash = "0.38"
async-channel = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
pangocairo = "0.22"
dirs = "7"
gdk4-wayland = { version = "0.11.5", features = ["wayland_crate"] }
gdk4-x11 = "0.11.5"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
x11rb = { version = "0.14", features = ["xinput"] }

[dev-dependencies]
tempfile = "3"
origami-core = { path = "../origami-core", features = ["selftest"] }
