[package]
name = "origami-gui"
version = "0.0.0"
publish = false
edition = "2021"
rust-version = "1.95"
license = "BSD-3-Clause"

[[bin]]
name = "origami-gui"
path = "src/main.rs"

[dependencies]
origami = { path = "../.." }
bytemuck = "1"
memmap2 = "0.9"
# A pinned master commit until Slint 1.19 ships (its femtovg 0.28 carries the
# pipeline-cache fix 1.18's femtovg 0.27 lacks).
slint = { git = "https://github.com/slint-ui/slint", rev = "3b68276e2fb5cfd965bdbfc7e78be0a91ebf1e26", default-features = false, features = ["std", "backend-winit", "renderer-femtovg-wgpu", "unstable-wgpu-30", "compat-1-2"] }
# Stock wgpu 30.0.2. Its Surface::configure can fail and lose the device when
# another thread submits to the same device while a window is created or
# resized. This viewer submits from one thread, so it is not affected; gfx-rs/wgpu
# pull request 10675 (hold command_indices around surface (un)configure) is
# needed before iris runs in this process, and its head does not yet build with
# Slint master (it is on wgpu's trunk API).
wgpu = "30"
pollster = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# QEMU's display socket is AF_UNIX on Windows too, and its segment a named
# file mapping.
[target.'cfg(windows)'.dependencies]
uds_windows = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Memory"] }

[build-dependencies]
slint-build = { git = "https://github.com/slint-ui/slint", rev = "3b68276e2fb5cfd965bdbfc7e78be0a91ebf1e26" }

[dev-dependencies]
serde_json = "1"
