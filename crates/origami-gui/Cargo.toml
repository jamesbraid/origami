[package]
name = "origami-gui"
version = "0.0.0"
publish = false
edition = "2021"
rust-version = "1.95"
license = "BSD-3-Clause"

[[bin]]
name = "origami-gui"
path = "src/main.rs"

[dependencies]
origami-core = { path = "../origami-core" }
origami-display = { path = "../origami-display" }
origami-engine = { path = "../origami-engine" }
origami-machine = { path = "../origami-machine" }
origami-qemu = { path = "../origami-qemu" }
origami-render = { path = "../origami-render" }
# A pinned master commit until Slint 1.19 ships (its femtovg 0.28 carries the
# pipeline-cache fix 1.18's femtovg 0.27 lacks).
slint = { git = "https://github.com/slint-ui/slint", rev = "3b68276e2fb5cfd965bdbfc7e78be0a91ebf1e26", default-features = false, features = ["std", "backend-winit", "renderer-femtovg-wgpu", "unstable-wgpu-30", "unstable-winit-030", "compat-1-2"] }
# The same wgpu 30 as origami-render, which owns the notes on its pinning.
wgpu = "30"
serde_json = "1"
# The serial console: a VT terminal emulator, a glyph rasteriser to draw its
# cells, and the system clipboard for copy and paste.
vt100 = "0.18"
fontdue = "0.9"
arboard = { version = "3", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# QEMU's display socket is AF_UNIX on Windows too, and its segment a named
# file mapping.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Memory"] }

[build-dependencies]
slint-build = { git = "https://github.com/slint-ui/slint", rev = "3b68276e2fb5cfd965bdbfc7e78be0a91ebf1e26" }

[dev-dependencies]
tempfile = "3"
