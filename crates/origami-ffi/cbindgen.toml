language = "C"
include_guard = "ORIGAMI_FRAME_H"
pragma_once = true
cpp_compat = true
sys_includes = ["stddef.h", "stdint.h"]
no_includes = true
documentation = true
documentation_style = "c99"
usize_is_size_t = true
header = """
/*
 * origami_frame.h: the C frame plane of origami-ffi (generated by cbindgen;
 * do not edit. Regenerate with bindings/gen-header.sh).
 *
 * Ownership: origami_core* and origami_machine* are reference-counted
 * handles you release exactly once. A machine handle does not keep the guest
 * alive. origami_view* is destroyed by origami_view_detach, before the window
 * it draws into.
 *
 * Threading: every function may be called from any thread, except the
 * origami_view_* functions, which one thread calls at a time. The wake
 * callback runs on an engine thread.
 *
 * Errors: every function returns an origami_status and catches panics. The
 * text of the calling thread's last failure is origami_last_error.
 *
 * Define ORIGAMI_FAKE before including this header to get the functions only
 * a build with the fake engine has.
 */
"""

[defines]
"feature = fake" = "ORIGAMI_FAKE"

[parse]
parse_deps = false

[export]
include = ["origami_key"]

[export.rename]
"CoreHandle" = "origami_core"

[enum]
rename_variants = "ScreamingSnakeCase"
prefix_with_name = true

[fn]
sort_by = "None"
