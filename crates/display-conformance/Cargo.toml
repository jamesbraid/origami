[package]
name = "display-conformance"
version = "0.0.0"
publish = false
edition = "2021"
rust-version = "1.95"
license = "BSD-3-Clause"

[dependencies]
origami-display = { path = "../origami-display" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
origami-display-producer = { path = "../origami-display-producer" }

[[bench]]
name = "viewer_frame"
harness = false
