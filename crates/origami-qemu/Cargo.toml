[package]
name = "origami-qemu"
version = "0.0.0"
publish = false
edition = "2021"
rust-version = "1.95"
license = "BSD-3-Clause"

[dependencies]
origami-engine = { path = "../origami-engine" }
origami-machine = { path = "../origami-machine" }
qapi = { version = "0.15", features = ["qmp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
toml = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation"] }
