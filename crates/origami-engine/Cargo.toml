[package]
name = "origami-engine"
version = "0.0.0"
publish = false
edition = "2021"
rust-version = "1.95"
license = "BSD-3-Clause"

[features]
# FakeEngine, an in-process engine for tests of everything above the engine
# boundary, and the contract suite every engine passes.
fake = []

[dependencies]
origami-machine = { path = "../origami-machine" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[[test]]
name = "fake"
required-features = ["fake"]
