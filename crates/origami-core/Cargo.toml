[package]
name = "origami-core"
version = "0.0.0"
publish = false
edition = "2021"
rust-version = "1.95"
license = "BSD-3-Clause"

[features]
# Makes `cargo test -p origami-core --features fake` valid beside origami-ffi.
fake = ["origami-engine/fake"]

[dependencies]
origami-engine = { path = "../origami-engine" }
origami-machine = { path = "../origami-machine" }
origami-protocol = { path = "../origami-protocol" }
dunce = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_System_SystemInformation"] }

[dev-dependencies]
origami-engine = { path = "../origami-engine", features = ["fake"] }
tempfile = "3"
