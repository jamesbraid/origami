[package]
name = "origami-core"
version = "0.0.0"
publish = false
edition = "2021"
rust-version = "1.95"
license = "BSD-3-Clause"

[dependencies]
origami-engine = { path = "../origami-engine" }
origami-machine = { path = "../origami-machine" }
dunce = "1"
serde = { version = "1", features = ["derive"] }
toml = "1"

[dev-dependencies]
origami-engine = { path = "../origami-engine", features = ["fake"] }
serde_json = "1"
tempfile = "3"
