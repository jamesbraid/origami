[package]
name = "origami-host"
version = "0.0.0"
description = "The runner: owns a running machine and serves its console and control"
publish = false
edition = "2021"
rust-version = "1.95"
license = "BSD-3-Clause"

[dependencies]
origami-engine = { path = "../origami-engine" }
origami-machine = { path = "../origami-machine" }
origami-protocol = { path = "../origami-protocol" }
origami-qemu = { path = "../origami-qemu" }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
