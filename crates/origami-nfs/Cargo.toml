[package]
name = "origami-nfs"
version = "0.0.0"
description = "NFSv2/v3, MOUNT and portmap server for sharing a host directory with a guest"
publish = false
edition = "2021"
rust-version = "1.95"
license = "BSD-3-Clause"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
