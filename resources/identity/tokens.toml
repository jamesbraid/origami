# Agreed UI numbers in layout units; edit here, then run `cargo xtask tokens`.
# Keys marked "not yet used" are decided and adopted as each app's PR lands.
version = 1

[size]
# Not yet used by any app: every size below.
tab_bar_height = 34
tab_height = 26
art_tab = 20
art_sidebar = 34
art_summary = 72
card = { w = 140, h = 104 }
art_gallery = { w = 120, h = 90 }
art_hero = { w = 240, h = 180 }
status_bar_height = 24

[colour]
# Used now: macOS and GTK granite_neutral (the machine pane's granite, the start card's gradient).
granite_neutral = ["#282a30", "#1f2126"]

# Alpha applied to the machine's measured colour. Not yet used.
[chassis]
tab_selected_fill = 0.22
tab_selected_stroke = 0.5

# Summary pane: top-to-bottom fade from the chassis colour to the window background. Not yet used.
[pane]
tint_top_alpha = 0.35
tint_bottom_alpha = 0.0
product_line_alpha = 0.70

# Spacing on a 4-unit grid. Not yet used.
[space]
xs = 4
s = 8
m = 12
l = 20
xl = 24

# Corner radii. Not yet used.
[radius]
control = 6
card = 10
sheet = 12
dot = 3.5

# Icon and mark sizes. Not yet used.
[icon]
toolbar = 16
row_dot = 7
empty_state = 64

# Durations in milliseconds. Not yet used.
[motion]
toast_ms = 4000
capture_hint_ms = 3000
fade_ms = 200
