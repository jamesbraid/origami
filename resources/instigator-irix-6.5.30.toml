format = 1
base_url = "https://origami-dist.irix.fans/irix/"
sets = ["6.5.30", "foundations", "development", "applications", "complementary"]
[package_selections.minimal]
install = ["nfs.sw.nfs"]
# The standard selection picks these, but their prerequisites are not on
# the minimal profile's discs. The overlay discs carry only 6.5.30 updates of
# MediaWarehouse and WebViewer, and inst will not install an update whose
# original product, on the Applications disc, is absent.
keep = [
    # Needs media_warehouse.sw.viewers from the Applications disc.
    "desktop_base.sw.dso6_2",
    # Needs webviewer.sw.eoe from the Applications disc.
    "insight.sw.sgihelp",
    # Inventor SDK: needs the Development Foundation and Libraries discs.
    "inventor_dev",
]

[package_selections.standard]
install = ["nfs.sw.nfs"]
keep = ["inventor_dev", "java2_plugin.sw32.mozilla_freeware", "java_dev.sw32.binaries"]

[[layers]]
set = "6.5.30"
name = "overlays1"
path = "6.5.30/overlays1.image"
remote_path = "6.5.30/overlays1.iso"
boot = true

[[layers]]
set = "6.5.30"
name = "overlays2"
path = "6.5.30/overlays2.image"
remote_path = "6.5.30/overlays2.iso"
boot = false

[[layers]]
set = "6.5.30"
name = "overlays3"
path = "6.5.30/overlays3.image"
remote_path = "6.5.30/overlays3.iso"
boot = false

[[layers]]
set = "foundations"
name = "foundation1"
path = "6.5-base/foundation1.image"
remote_path = "6.5-base/foundation1.iso"
boot = false

[[layers]]
set = "foundations"
name = "foundation2"
path = "6.5-base/foundation2.image"
remote_path = "6.5-base/foundation2.iso"
boot = false

[[layers]]
set = "foundations"
name = "onc3-nfs"
path = "6.5-base/nfs.image"
remote_path = "6.5-base/nfs.iso"
boot = false
dist = "dist6.5"

[[layers]]
set = "development"
name = "devlibs"
path = "6.5-base/devlibs.image"
remote_path = "6.5-base/devlibs.iso"
boot = false

[[layers]]
set = "development"
name = "devfoundation"
path = "6.5-base/devfoundation.image"
remote_path = "6.5-base/devfoundation.iso"
boot = false
dist = "dist/dist6.5"

[[layers]]
set = "applications"
name = "applications"
path = "6.5.30/applications.image"
remote_path = "6.5.30/applications.iso"
boot = false

[[layers]]
set = "complementary"
name = "complementary"
path = "6.5.30/complementary.image"
remote_path = "6.5.30/complementary.iso"
boot = false
